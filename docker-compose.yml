services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - db-data:/app/data
      - ./media:/media:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # DBMS independiente para la app de reconocimiento facial.
  face-db:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FACE_DB_PORT:-8003}:8000"
    volumes:
      - face-db-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # DBMS independiente para la app de detección de audio.
  audio-db:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AUDIO_DB_PORT:-8004}:8000"
    volumes:
      - audio-db-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # Corpus FMA: corre una vez antes de audio-api. Descarga los clips en
  # audio-db-data y carga las tablas/vectores usando solo audio-db.
  audio-data:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      audio-db:
        condition: service_healthy
    environment:
      DBMS_API_URL: http://audio-db:8000
      AUDIO_CORPUS_DIR: /app/data/audio/fma
    volumes:
      - audio-db-data:/app/data
      - ./apps/audio-copyright/dataset:/app/apps/audio-copyright/dataset:ro
      - ./apps/audio-copyright/features:/app/apps/audio-copyright/features:ro
    command:
      - sh
      - -c
      - python apps/audio-copyright/dataset/prepare_corpus.py && python apps/audio-copyright/dataset/load_songs.py && python apps/audio-copyright/features/extract_segments.py
    restart: "no"

  # API de detección de copyright (#113), en http://localhost:8001. Se inicia
  # después de la preparación del corpus y escribe solo en audio-db.
  audio-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      audio-db:
        condition: service_healthy
      audio-data:
        condition: service_completed_successfully
    environment:
      DBMS_API_URL: http://audio-db:8000
      AUDIO_CORPUS_DIR: /app/data/audio/fma
    ports:
      - "${AUDIO_API_PORT:-8001}:8001"
    volumes:
      # con escritura: POST /songs guarda los audios agregados en data/audio/uploads/
      - audio-db-data:/app/data
      - ./apps/audio-copyright:/app/apps/audio-copyright:ro
    command:
      - uvicorn
      - detection_api:app
      - --app-dir
      - apps/audio-copyright/backend
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # API de reconocimiento facial; sus tablas e índices se guardan solo en face-db.
  face-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      face-db:
        condition: service_healthy
    environment:
      DBMS_API_URL: http://face-db:8000
      FACE_YUNET_MODEL: /app/benchmarks/corpus/face/models/face_detection_yunet_2026may.onnx
      FACE_SFACE_MODEL: /app/benchmarks/corpus/face/models/face_recognition_sface_2021dec.onnx
    volumes:
      - ./benchmarks/corpus/face/models:/app/benchmarks/corpus/face/models:ro
    command:
      - uvicorn
      - backend.main:app
      - --app-dir
      - apps/face-recognition
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    ports:
      - "${FACE_API_PORT:-8002}:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/health', timeout=2); assert Path('/app/benchmarks/corpus/face/models/face_detection_yunet_2026may.onnx').is_file(); assert Path('/app/benchmarks/corpus/face/models/face_recognition_sface_2021dec.onnx').is_file()"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  face-frontend:
    build:
      context: ./apps/face-recognition/frontend
      dockerfile: Dockerfile
      args:
        VITE_FACE_API_URL: /face-api
    restart: unless-stopped
    depends_on:
      face-api:
        condition: service_healthy
    ports:
      - "${FACE_FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Interfaz de la detección de copyright (#114), en http://localhost:8082. nginx sirve la
  # app y reenvía /api a audio-api:
  #   docker compose up -d audio-frontend
  audio-frontend:
    build:
      context: ./apps/audio-copyright/frontend
      dockerfile: Dockerfile
      args:
        VITE_AUDIO_API_URL: /api
    restart: unless-stopped
    depends_on:
      audio-api:
        condition: service_healthy
    ports:
      - "${AUDIO_FRONTEND_PORT:-8082}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  db-data:
  face-db-data:
  audio-db-data:
