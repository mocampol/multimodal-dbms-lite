services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - db-data:/app/data
      - ./media:/media:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  # Corpus de audio para la detección de copyright (#110). Se corre a mano, una vez:
  #   docker compose --profile audio run --rm audio-data
  # Descarga los clips de FMA en el volumen db-data y carga canciones y artistas por la
  # API, y extrae un vector MFCC por segmento de cada canción (#111). Es idempotente:
  # si ya está todo, termina en segundos sin descargar ni extraer nada.
  audio-data:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["audio"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DBMS_API_URL: http://api:8000
      AUDIO_CORPUS_DIR: /app/data/audio/fma
    volumes:
      - db-data:/app/data
      - ./apps/audio-copyright/dataset:/app/apps/audio-copyright/dataset:ro
      - ./apps/audio-copyright/features:/app/apps/audio-copyright/features:ro
    command:
      - sh
      - -c
      - python apps/audio-copyright/dataset/prepare_corpus.py && python apps/audio-copyright/dataset/load_songs.py && python apps/audio-copyright/features/extract_segments.py
    restart: "no"

  # API de detección de copyright (#113), en http://localhost:8001. Usa el codebook y los
  # segmentos que deja audio-data, así que se levanta después de correrlo:
  #   docker compose --profile audio up -d audio-api
  audio-api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["audio"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DBMS_API_URL: http://api:8000
      AUDIO_CORPUS_DIR: /app/data/audio/fma
    ports:
      - "${AUDIO_API_PORT:-8001}:8001"
    volumes:
      - db-data:/app/data:ro
      - ./apps/audio-copyright:/app/apps/audio-copyright:ro
    command:
      - uvicorn
      - detection_api:app
      - --app-dir
      - apps/audio-copyright/backend
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  db-data:
